<div class="ec-lightbox" data-lightbox>
  <button class="ec-lightbox-close" data-lightbox-close aria-label="Fechar">

  <button class="ec-lightbox-next" data-lightbox-next aria-label="Próxima">
    <svg width="14" height="24" viewBox="0 0 14 24" fill="none"><path d="M2 1L12 12L2 23" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <figure class="ec-lightbox-figure">
    <img class="ec-lightbox-img" data-lightbox-img src="" alt="">

  </figure>

</div>

<script>
(function () {
  'use strict';

  var IMAGES = [
    { src: 'uploads/tack-lift/capa.jpg',           label: 'Torre' },
    { src: 'uploads/tack-lift/portaria.jpg',       label: 'Portaria' },
    { src: 'uploads/tack-lift/piscina.jpg',        label: 'Piscina' },
    { src: 'uploads/tack-lift/giardino.jpg',       label: 'Giardino' },
    { src: 'uploads/tack-lift/playground.jpg',     label: 'Playground' },
    { src: 'uploads/tack-lift/quadra.jpg',         label: 'Quadra' },
    { src: 'uploads/tack-lift/fitness.jpg',        label: 'Fitness' },
    { src: 'uploads/tack-lift/coworking.jpg',      label: 'Coworking' },
    { src: 'uploads/tack-lift/market.jpg',         label: 'Market' },
    { src: 'uploads/tack-lift/foodtruck.jpg',      label: 'Food Truck' },
    { src: 'uploads/tack-lift/delivery.jpg',       label: 'Delivery' },
    { src: 'uploads/tack-lift/churrasqueira.jpg',  label: 'Churrasqueira' },
    { src: 'uploads/tack-lift/beer-lounge.jpg',    label: 'Beer Lounge' },
    { src: 'uploads/tack-lift/happy-hour.jpg',     label: 'Happy Hour' },
    { src: 'uploads/tack-lift/festas.jpg',         label: 'Festas' },
    { src: 'uploads/tack-lift/brinquedoteca.jpg',  label: 'Brinquedoteca' },
    { src: 'uploads/tack-lift/lavanderia.jpg',     label: 'Lavanderia' }
  ];

  var gallery = document.querySelector('[data-gallery]');
  IMAGES.forEach(function (item, i) {
    var fig = document.createElement('button');
    fig.className = 'ec-grid-item';
    fig.type = 'button';
    fig.setAttribute('data-index', String(i));
    fig.setAttribute('aria-label', 'Abrir imagem: ' + item.label);
    fig.innerHTML =
      '<img src="' + item.src + '" alt="Tack Lift — ' + item.label + '" loading="lazy">' +
      '<span class="ec-grid-label">' + item.label + '</span>';
    gallery.appendChild(fig);
  });

  var lightbox     = document.querySelector('[data-lightbox]');
  var lightboxImg   = document.querySelector('[data-lightbox-img]');
  var lightboxCap   = document.querySelector('[data-lightbox-caption]');
  var lightboxCount = document.querySelector('[data-lightbox-count]');
  var current = 0;

  function openLightbox(index) {
    current = index;
    render();
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function render() {
    var item = IMAGES[current];
    lightboxImg.src = item.src;
    lightboxImg.alt = 'Tack Lift — ' + item.label;
    lightboxCap.textContent = item.label;
    lightboxCount.textContent = pad(current + 1) + ' / ' + pad(IMAGES.length);
  }

  function step(delta) {
    current = (current + delta + IMAGES.length) % IMAGES.length;
    render();
  }

  gallery.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-index]');
    if (!btn) return;
    openLightbox(Number(btn.getAttribute('data-index')));
  });

  document.querySelector('[data-lightbox-close]').addEventListener('click', closeLightbox);
  document.querySelector('[data-lightbox-prev]').addEventListener('click', function () { step(-1); });
  document.querySelector('[data-lightbox-next]').addEventListener('click', function () { step(1); });

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  window.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  /* ---------- mobile hamburger menu ---------- */
  var navToggle = document.querySelector('[data-nav-toggle]');
  var navLinks  = document.querySelector('[data-nav-links]');
  if (navToggle && navLinks) {
    var setMenuOpen = function (isOpen) {
      navLinks.classList.toggle('is-open', isOpen);
      navToggle.classList.toggle('is-open', isOpen);
      navToggle.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    };
    navToggle.addEventListener('click', function () {
      setMenuOpen(!navLinks.classList.contains('is-open'));
    });
    navLinks.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') setMenuOpen(false);
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navLinks.classList.contains('is-open')) setMenuOpen(false);
    });
  }
})();
</script>

</body>
