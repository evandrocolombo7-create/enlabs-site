<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archviz — Evandro Colombo</title>
<meta name="description" content="Seleção de imagens de archviz e CGI para projetos de arquitetura, por Evandro Colombo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
  :root{
    --ink:#0A0A0A;
    --paper:#FAFAFA;
    --gray-600:#4D4D4D;
    --gray-400:#8C8C8C;
    --content-max:1400px;
    --content-pad:clamp(20px,5vw,72px);
    --space-8:64px;
    --tracking-caption:0.1em;
    --ease-standard:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{font-family:'Jost','Century Gothic',-apple-system,'Segoe UI',sans-serif;color:var(--paper);width:100%;}
  a{color:var(--paper);text-decoration:none;}
  a:hover{color:#B0B0B0;}

  .ec-nav{
    position:fixed;top:0;left:0;width:100%;z-index:50;
    display:flex;justify-content:center;
    padding:22px clamp(24px,6vw,96px);
  }
  .ec-nav-links{display:flex;gap:clamp(20px,4vw,48px);}
  .ec-nav a{
    font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#D8D8D8;
    padding-bottom:6px;border-bottom:1px solid transparent;
    transition:color .3s ease,border-color .3s ease;
  }
  .ec-nav a:hover{color:var(--paper);border-bottom-color:var(--paper);}
  .ec-nav a.is-active{color:var(--paper);border-bottom-color:var(--paper);}
  .ec-nav-toggle{display:none;}

  /* ---------- language switch ---------- */
  .ec-lang{
    position:fixed;top:24px;right:clamp(24px,6vw,96px);z-index:51;
    display:flex;align-items:center;gap:6px;
    font-size:11px;letter-spacing:0.12em;
  }
  .ec-lang a{color:var(--gray-400);transition:color .3s ease;}
  .ec-lang a:hover{color:var(--paper);}
  .ec-lang .is-current{color:var(--paper);}
  .ec-lang-sep{color:#3A3A3A;}

  .ec-hero{
    position:relative;height:70vh;min-height:480px;overflow:hidden;
    display:flex;align-items:center;
  }
  .ec-hero-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(0.35) contrast(1.02);
  }
  .ec-hero-scrim{position:absolute;inset:0;background:rgba(10,10,10,0.58);}
  .ec-hero-inner{
    position:relative;z-index:1;max-width:var(--content-max);
    margin:0 auto;padding:0 var(--content-pad);width:100%;
  }
  .ec-hero-lede{max-width:52ch;font-size:17px;line-height:1.7;color:#D8D8D8;margin:0;}

  .ec-grid{display:grid;grid-template-columns:repeat(3,1fr);}
  .ec-grid-item{position:relative;aspect-ratio:4/5;overflow:hidden;display:block;}
  .ec-grid-item img{
    width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) contrast(1.02);
    transition:filter .3s var(--ease-standard);display:block;
  }
  .ec-grid-item:hover img{filter:none;}
  .ec-grid-label{
    position:absolute;top:16px;left:16px;font-size:12px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--paper);pointer-events:none;
  }

  @media (max-width:820px){
    .ec-grid{grid-template-columns:1fr;}

    .ec-nav-toggle{
      display:flex;flex-direction:column;justify-content:center;gap:5px;
      position:fixed;top:20px;right:20px;z-index:61;
      width:36px;height:36px;padding:0;
      background:transparent;border:none;cursor:pointer;
    }
    .ec-nav-toggle span{
      display:block;width:100%;height:1.5px;background:var(--paper);
      transition:transform .25s ease,opacity .25s ease;
    }
    .ec-nav-toggle.is-open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
    .ec-nav-toggle.is-open span:nth-child(2){opacity:0;}
    .ec-nav-toggle.is-open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

    .ec-nav-links{
      position:fixed;inset:0;z-index:60;
      flex-direction:column;align-items:center;justify-content:center;gap:28px;
      background:rgba(10,10,10,0.98);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .25s ease;
    }
    .ec-nav-links.is-open{opacity:1;visibility:visible;pointer-events:auto;}
    .ec-nav-links a{font-size:15px;}

    .ec-lang{top:22px;left:20px;right:auto;}
  }

  .ec-footer{padding:var(--space-8) var(--content-pad);text-align:center;}
  .ec-footer span{
    font-size:12px;letter-spacing:var(--tracking-caption);
    text-transform:uppercase;color:var(--gray-400);
  }
</style>
</head>
<body>

<nav class="ec-nav">
  <div class="ec-nav-links" data-nav-links>
    <a href="index.html#home">Home</a>
    <a href="visualizacao.html" class="is-active">Archviz</a>
    <a href="arquitetura.html">Arquitetura</a>
    <a href="index.html#sobre">Sobre</a>
    <a href="index.html#contato">Contato</a>
  </div>
  <button class="ec-nav-toggle" type="button" data-nav-toggle aria-label="Abrir menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="ec-lang">
  <span class="is-current">PT</span>
  <span class="ec-lang-sep">/</span>
  <a href="en/visualizacao.html">EN</a>
</div>

<section class="ec-hero">
  <img class="ec-hero-img" src="uploads/TACK-NEXUS-FACHADA.jpg" alt="Fachada Tack Nexus">
  <div class="ec-hero-scrim"></div>
  <div class="ec-hero-inner">
    <p class="ec-hero-lede">Uma seleção de imagens produzidas ao longo de minha jornada como artista de archviz.</p>
  </div>
</section>

<div class="ec-grid">
  <a class="ec-grid-item" href="projeto-tack-nexus.html">
    <img src="uploads/TACK-NEXUS-FACHADA.jpg" alt="Render — Tack Nexus, fachada noturna">
    <span class="ec-grid-label">Tack Nexus</span>
  </a>
  <a class="ec-grid-item" href="projeto-tack-lift.html">
    <img src="uploads/tack-lift/capa.jpg" alt="Render — Tack Lift, torre">
    <span class="ec-grid-label">Tack Lift</span>
  </a>
  <a class="ec-grid-item" href="projeto-viver-mais.html">
    <img src="uploads/viver-mais/capa.jpg" alt="Render — Viver Mais, fachada">
    <span class="ec-grid-label">Viver Mais</span>
  </a>
  <a class="ec-grid-item" href="projeto-granps-grange.html">
    <img src="uploads/granps-grange/capa.jpg" alt="Render — Granps Grange, interior rústico">
    <span class="ec-grid-label">Granps Grange</span>
  </a>
  <a class="ec-grid-item" href="projeto-el-torre01.html">
    <img src="uploads/EL-TORRE01-FACHADA%20BASE.jpg" alt="Render — El Torre 01, fachada diurna">
    <span class="ec-grid-label">El Torre 01</span>
  </a>
  <a class="ec-grid-item" href="projeto-casa-patio.html">
    <img src="uploads/replicate-prediction-0qsf81y7nnrn80cwwevswjmxvm%20copiar.jpg" alt="Render — interior integrado com piscina">
    <span class="ec-grid-label">Casa Pátio Coberto</span>
  </a>
</div>

<footer class="ec-footer">
  <span>evandrocolombo</span>
</footer>

<script>
(function () {
  'use strict';
  var navToggle = document.querySelector('[data-nav-toggle]');
  var navLinks  = document.querySelector('[data-nav-links]');
  if (!navToggle || !navLinks) return;

  var setMenuOpen = function (isOpen) {
    navLinks.classList.toggle('is-open', isOpen);
    navToggle.classList.toggle('is-open', isOpen);
    navToggle.setAttribute('aria-expanded', String(isOpen));
    document.body.style.overflow = isOpen ? 'hidden' : '';
  };
  navToggle.addEventListener('click', function () {
    setMenuOpen(!navLinks.classList.contains('is-open'));
  });
  navLinks.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') setMenuOpen(false);
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && navLinks.classList.contains('is-open')) setMenuOpen(false);
  });
})();
</script>

</body>
</html>
