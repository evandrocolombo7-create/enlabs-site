<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archviz — Evandro Colombo</title>
<meta name="description" content="Seleção de imagens de archviz e CGI para projetos de arquitetura, por Evandro Colombo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
  :root{
    --ink:#0A0A0A;
    --paper:#FAFAFA;
    --gray-600:#4D4D4D;
    --gray-400:#8C8C8C;
    --content-max:1400px;
    --content-pad:clamp(20px,5vw,72px);
    --space-8:64px;
    --tracking-caption:0.1em;
    --ease-standard:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{font-family:'Jost','Century Gothic',-apple-system,'Segoe UI',sans-serif;color:var(--paper);width:100%;}
  a{color:var(--paper);text-decoration:none;}
  a:hover{color:#B0B0B0;}

  .ec-nav{
    position:fixed;top:0;left:0;width:100%;z-index:50;
    display:flex;justify-content:center;gap:clamp(20px,4vw,48px);
    padding:22px clamp(24px,6vw,96px);
  }
  .ec-nav a{
    font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#D8D8D8;
    padding-bottom:6px;border-bottom:1px solid transparent;
    transition:color .3s ease,border-color .3s ease;
  }
  .ec-nav a:hover{color:var(--paper);border-bottom-color:var(--paper);}
  .ec-nav a.is-active{color:var(--paper);border-bottom-color:var(--paper);}

  .ec-hero{
    position:relative;height:70vh;min-height:480px;overflow:hidden;
    display:flex;align-items:center;
  }
  .ec-hero-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(0.35) contrast(1.02);
  }
  .ec-hero-scrim{position:absolute;inset:0;background:rgba(10,10,10,0.58);}
  .ec-hero-inner{
    position:relative;z-index:1;max-width:var(--content-max);
    margin:0 auto;padding:0 var(--content-pad);width:100%;
  }
  .ec-hero-lede{max-width:52ch;font-size:17px;line-height:1.7;color:#D8D8D8;margin:0;}

  .ec-grid{display:grid;grid-template-columns:repeat(3,1fr);}
  .ec-grid-item{position:relative;aspect-ratio:4/5;overflow:hidden;display:block;}
  .ec-grid-item img{
    width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) contrast(1.02);
    transition:filter .3s var(--ease-standard);display:block;
  }
  .ec-grid-item:hover img{filter:none;}
  .ec-grid-label{
    position:absolute;top:16px;left:16px;font-size:12px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--paper);pointer-events:none;
  }

  @media (max-width:820px){
    .ec-grid{grid-template-columns:1fr;}
  }

  .ec-footer{padding:var(--space-8) var(--content-pad);text-align:center;}
  .ec-footer span{
    font-size:12px;letter-spacing:var(--tracking-caption);
    text-transform:uppercase;color:var(--gray-400);
  }
</style>
</head>
<body>

<nav class="ec-nav">
  <a href="index.html#home">Home</a>
  <a href="visualizacao.html" class="is-active">Archviz</a>
  <a href="index.html#arquitetura">Arquitetura</a>
  <a href="index.html#sobre">Sobre</a>
  <a href="index.html#contato">Contato</a>
</nav>

<section class="ec-hero">
  <img class="ec-hero-img" src="uploads/TACK-NEXUS-FACHADA.jpg" alt="Fachada Tack Nexus">
  <div class="ec-hero-scrim"></div>
  <div class="ec-hero-inner">
    <p class="ec-hero-lede">Uma seleção de imagens produzidas ao longo de minha jornada como artista de archviz.</p>
  </div>
</section>

<div class="ec-grid">
  <a class="ec-grid-item" href="projeto-tack-nexus.html">
    <img src="uploads/TACK-NEXUS-FACHADA.jpg" alt="Render — Tack Nexus, fachada noturna">
    <span class="ec-grid-label">Tack Nexus</span>
  </a>
  <a class="ec-grid-item" href="projeto-el-torre01.html">
    <img src="uploads/EL-TORRE01-FACHADA%20BASE.jpg" alt="Render — El Torre 01, fachada diurna">
    <span class="ec-grid-label">El Torre 01</span>
  </a>
  <a class="ec-grid-item" href="projeto-casa-patio.html">
    <img src="uploads/replicate-prediction-0qsf81y7nnrn80cwwevswjmxvm%20copiar.jpg" alt="Render — interior integrado com piscina">
    <span class="ec-grid-label">Casa Pátio Coberto</span>
  </a>
</div>

<footer class="ec-footer">
  <span>evandrocolombo</span>
</footer>

</body>
</html>
